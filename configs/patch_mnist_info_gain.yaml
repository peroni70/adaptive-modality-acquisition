# Does the info-gain value function learn anything?
#
# The question is answered by one number: skill_vs_constant in
# <run_dir>/info_gain/value_model_scores.json. Zero means the model is no
# better than predicting the training mean; clearly positive means it learned.
#
# Scoped deliberately: 8k training examples and 20 epochs is enough to
# separate "learns" from "does not". To run at full scale, delete the
# max_examples block and set value_model.epochs to 100.
#
# No policy evaluation here - that is the expensive stage and it has no
# bearing on whether the value model fits its target.
app: patch_mnist
context_idx: 10
seed: 0
device: auto
run_dir: runs/patch_mnist_info_gain

data:
  root: ~/.cache/ama/mnist
  train_fraction: 0.9
  max_examples: {train: 8000, val: 2000, test: 2000}

masker:
  type: patch
  grid: {image_size: 28, patch_size: 7}

metrics:
  n_classes: 10

classifier:
  encoder: {type: conv}
  hidden: [128, 64, 32]
  mode_emb_dim: 1028
  fusion: early
  epochs: 15
  lr: 0.001
  batch_size: 64

value_model:
  encoder: {type: conv}
  hidden: [256, 128, 64]
  mode_emb_dim: 1028
  fusion: early
  epochs: 20
  lr: 0.001
  weight_decay: 0.00001
  batch_size: 32
  n_repeats: {train: 1, val: 2, test: 1}
  use_hinge_loss: true
  calibrate: false          # info_gain is a regression head, nothing to calibrate
  # Targets are generated one example at a time, so they belong on CPU workers
  # while the value model itself trains batched on the GPU. "auto" sizes the
  # pool from the CPUs allocated to the job.
  target_device: cpu
  num_workers: auto

policy:
  value_fns: [info_gain]
