# Patch-MNIST: MNIST digits cut into a 4x4 grid of 7x7 patches.
# Each patch is an acquirable modality; the centre patch is free context.
app: patch_mnist
context_idx: 10          # centre patch, rows 14:21 cols 14:21
seed: 0
device: auto
run_dir: runs/patch_mnist

data:
  root: ~/.cache/ama/mnist
  train_fraction: 0.9
  # Cap split sizes for a quick run; remove for the full experiment.
  max_examples: {}

masker:
  type: patch
  grid: {image_size: 28, patch_size: 7}

metrics:
  n_classes: 10

classifier:
  encoder: {type: conv}
  hidden: [128, 64, 32]
  mode_emb_dim: 1028
  fusion: early
  epochs: 15
  lr: 0.001
  batch_size: 64

value_model:
  encoder: {type: conv}
  hidden: [256, 128, 64]
  mode_emb_dim: 1028
  fusion: early
  epochs: 100
  lr: 0.001
  weight_decay: 0.00001
  batch_size: 32
  n_repeats: {train: 1, val: 2, test: 1}
  use_hinge_loss: true
  calibrate: true
  calibration_epochs: 10

policy:
  value_fns: [acc_change, bit_flip]
  alphas: [0.0, 0.01, 0.03, 0.05, 0.07, 0.1]
  optimizers: [rand_usm, greedy_usm, hybrid_usm, single_item_greedy]
  include_adaptive_greedy: true
  include_calibrated: true
  batch_size: 64
